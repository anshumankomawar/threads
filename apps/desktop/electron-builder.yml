appId: com.threads.arc
productName: Arc
# Signing in comes back to the app on a com.threads.arc:// link (src/main/signIn.ts).
protocols:
  - name: Threads
    schemes:
      - com.threads.arc
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
win:
  executableName: Arc
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # The Icon Composer bundle: the dotted sunrise in a window, on a white (dark: graphite) tile; macOS 26 adds the glass
  # and switches light, dark, clear and tinted itself. Building it needs Xcode 26; electron-builder also makes an .icns
  # from it for older macOS.
  icon: build/AppIcon.icon
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icons
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
